<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor de Palabras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/icons/icon_farouk.svg') }}">
</head>

<body class="bg-gradient-to-br from-slate-100 via-purple-200 to-pink-300 min-h-screen flex items-center justify-center">

    <div class="flex flex-col lg:flex-row w-full max-w-7xl p-6 gap-6">
        <div class="flex-1 flex flex-col gap-6">
            <div class="bg-white rounded-3xl shadow-2xl p-8 text-center transition-transform hover:scale-[1.02]">
                <img src="{{ url_for('static', filename='images/icons/icon_farouk.svg') }}" class="mx-auto mb-6 w-36">
                <input 
                    type="text" 
                    id="words" 
                    placeholder="Empieza a escribir..."
                    class="w-full px-5 py-4 text-lg border-2 border-slate-300 rounded-2xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-300 transition-all duration-200"
                >
            </div>

            <div class="bg-white rounded-3xl shadow-2xl p-6">
                <h2 class="text-sm font-semibold text-slate-600 mb-3 uppercase tracking-wide">Sugerencias</h2>
                <div id="suggestionstext" class="flex flex-wrap gap-3"></div>
            </div>

            <div class="bg-white rounded-3xl shadow-2xl p-6 flex flex-col gap-4 transition-transform hover:scale-[1.01]">
                <div class="flex flex-wrap items-center justify-center gap-4">
                    <button onclick="downloadPDF()" class="flex items-center gap-2 bg-red-500 text-white font-medium px-5 py-3 rounded-xl shadow-md border-b-4 border-red-600 hover:bg-red-400 hover:border-red-500 transition">
                        <img src="{{ url_for('static', filename='images/icons/pdf-icon.png') }}" class="w-5 h-5">
                        Descargar en PDF
                    </button>

                    <label title="Subir resolución para PDF" class="flex items-center cursor-pointer gap-2 px-4 py-2 bg-gray-500 text-white rounded-xl border-b-4 border-gray-600 hover:bg-gray-400 hover:border-gray-500 transition">
                        <input id="resolution" type="checkbox" class="peer h-6 w-6 cursor-pointer transition-all appearance-none rounded-full bg-slate-100 shadow hover:shadow-md border border-slate-300 checked:bg-slate-800 checked:border-slate-800">
                        <span class="absolute text-white opacity-0 peer-checked:opacity-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </span>
                    </label>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 mt-4">
                    <h4 class="text-lg font-semibold mb-2" id="inputrange">Número de sugerencias: 5</h4>
                    <input type="range" min="1" max="25" value="5" id="suggestions" class="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>
            </div>
        </div>

        <div class="flex-1 flex items-center justify-center bg-white rounded-3xl shadow-2xl p-4">
            <img id="image" src="{{ url_for('static', filename='images/candidates_graph.png') }}" class="max-w-full max-h-full object-contain">
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/input.js') }}"></script>

    <style>
    *, ::before, ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
    }

    html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
        margin: 0;
        line-height: inherit;
    }

    img, svg {
        display: block;
        vertical-align: middle;
    }

    img {
        max-width: 100%;
        height: auto;
    }

    button, input, optgroup, select, textarea {
        font-family: inherit;
        font-size: 100%;
        line-height: inherit;
        color: inherit;
        margin: 0;
        padding: 0;
    }

    button, [type='button'], [type='reset'], [type='submit'] {
        -webkit-appearance: button;
        background-color: transparent;
        background-image: none;
        cursor: pointer;
    }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }

    .w-full { width: 100%; }
    .min-h-screen { min-height: 100vh; }
    .max-w-7xl { max-width: 80rem; } /* 1280px */
    .w-36 { width: 9rem; }
    .w-5 { width: 1.25rem; }
    .h-5 { height: 1.25rem; }
    .h-6 { height: 1.5rem; }
    .w-6 { width: 1.5rem; }
    .h-2 { height: 0.5rem; }

    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .p-8 { padding: 2rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }

    .m-0 { margin: 0; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-4 { margin-top: 1rem; }

    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .gap-6 { gap: 1.5rem; }

    .text-center { text-align: center; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .uppercase { text-transform: uppercase; }
    .tracking-wide { letter-spacing: 0.025em; }

    .text-white { color: #ffffff; }
    .text-slate-600 { color: #475569; }

    .bg-white { background-color: #ffffff; }
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-slate-100 { background-color: #f1f5f9; }
    .bg-indigo-200 { background-color: #c7d2fe; }

    .bg-red-500 { background-color: #ef4444; }
    .bg-gray-500 { background-color: #6b7280; }

    .bg-gradient-to-br {
        background-image: linear-gradient(to bottom right, var(--tw-gradient-stops));
    }
    .from-slate-100 {
        --tw-gradient-from: #f1f5f9;
        --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgb(241 245 249 / 0));
    }
    .via-purple-200 {
        --tw-gradient-to: rgb(233 213 255 / 0);
        --tw-gradient-stops: var(--tw-gradient-from), #e9d5ff, var(--tw-gradient-to);
    }
    .to-pink-300 {
        --tw-gradient-to: #f9a8d4;
    }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }

    .border { border-width: 1px; }
    .border-2 { border-width: 2px; }
    .border-b-4 { border-bottom-width: 4px; }

    .border-slate-300 { border-color: #cbd5e1; }
    .border-red-600 { border-color: #dc2626; }
    .border-gray-600 { border-color: #4b5563; }

    .shadow { box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); }
    .shadow-md { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
    .opacity-0 { opacity: 0; }

    .cursor-pointer { cursor: pointer; }
    .object-contain { object-fit: contain; }
    .appearance-none { appearance: none; }
    .accent-indigo-500 { accent-color: #6366f1; }
    .absolute { position: absolute; }

    .transition { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-transform { transition-property: transform; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .duration-200 { transition-duration: 200ms; }

    .hover\:scale-\[1\.02\]:hover { transform: scale(1.02); }
    .hover\:scale-\[1\.01\]:hover { transform: scale(1.01); }

    .hover\:bg-red-400:hover { background-color: #f87171; }
    .hover\:border-red-500:hover { border-color: #ef4444; }

    .hover\:bg-gray-400:hover { background-color: #9ca3af; }
    .hover\:border-gray-500:hover { border-color: #6b7280; }

    .hover\:shadow-md:hover { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }

    .focus\:outline-none:focus { outline: 2px solid transparent; outline-offset: 2px; }
    .focus\:border-indigo-500:focus { border-color: #6366f1; }
    .focus\:ring-2:focus { --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color); --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color); box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000); }
    .focus\:ring-indigo-300:focus { --tw-ring-opacity: 1; --tw-ring-color: rgb(165 180 252 / var(--tw-ring-opacity)); }

    .checked\:bg-slate-800:checked { background-color: #1e293b; }
    .checked\:border-slate-800:checked { border-color: #1e293b; }

    .peer:checked ~ .peer-checked\:opacity-100 {
        opacity: 1;
    }

    @media (min-width: 1024px) {
        .lg\:flex-row {
            flex-direction: row;
        }
    }

    .bg-indigo-50 { background-color: #eef2ff; }
    .text-indigo-700 { color: #4338ca; }

    .hover\:bg-indigo-100:hover { background-color: #e0e7ff; }

    .transition-colors {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
    }
    </style>
</body>
</html>
